name: FokendLegendaryWepons
version: '${version}'
main: fokend.legendaryweapons.FokendLegendaryWepons
api-version: '1.21.11'
authors: [ Fokend ]
description: Легендарное оружие и ядра SMP

commands:
  legendary:
    description: Выдача легендарного оружия и управление состояниями
    usage: /legendary <id|give|confirm|fix|clearsouls|resetcrafts|disable|enable|disabled>
    permission: legendary.admin
  revive:
    description: Возродить игрока и очистить бездушие за 5 сердец
    usage: /revive <ник>
    permission: legendary.revive
  godeye:
    description: Тетрадь Смерти - отдать 5 сердец, чтобы видеть невидимок
    usage: /godeye
  refusenote:
    description: Тетрадь Смерти - отказаться от тетради
    usage: /refusenote
  check:
    description: Тетрадь Смерти - угадать владельца
    usage: /check <ник>
  legends:
    description: Летопись легенд - кто владеет каждой легендаркой и её история
    usage: /legends [review|approve|discard|info|call|retire]
    permission: legends.use
  dnunlock:
    description: Снять вечный режим приключений
    usage: /dnunlock <ник>
    permission: legendary.admin

permissions:
  legends.use:
    description: Открывать /legends
    default: true
  legendary.admin:
    description: Доступ к командам /legendary и /dnunlock
    default: op
  legendary.revive:
    description: Право возрождать игроков через /revive
    default: true
